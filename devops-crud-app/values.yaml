# Global Helm chart settings
nameOverride: ""
fullnameOverride: ""

# Backend configuration
backend:
  replicas: 2

  image:
    repository: devops-crud-app-backend
    tag: latest
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 5000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  probes:
    liveness:
      path: /healthz
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 3

    readiness:
      path: /healthz
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3

# Frontend configuration
frontend:
  replicas: 2

  image:
    repository: devops-crud-app-frontend
    tag: latest
    pullPolicy: Never

  service:
    type: ClusterIP
    port: 3000

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# Backend Horizontal Pod Autoscaler
backendHPA:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

# Ingress configuration
ingress:
  enabled: true
  className: nginx

  host: myapp.local

  frontendPath: /
  backendPath: /api

# PostgreSQL configuration
postgres:
  image:
    repository: postgres
    tag: "16"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  storage:
    size: 1Gi
    accessMode: ReadWriteOnce
    storageClass: standard
