{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: {{ include "devops-crud-app.fullname" . }}-ingress
  labels:
    {{- include "devops-crud-app.labels" . | nindent 4 }}

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: {{ .Values.ingress.host }}

      http:
        paths:
          # Frontend — serves the React app
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "devops-crud-app.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}

          # Backend — serves API endpoints under /api
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "devops-crud-app.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.service.port }}
{{- end }}
