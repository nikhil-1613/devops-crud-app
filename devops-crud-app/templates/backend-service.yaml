apiVersion: v1
kind: Service

metadata:
  name: {{ include "devops-crud-app.fullname" . }}-backend
  labels:
    {{- include "devops-crud-app.labels" . | nindent 4 }}
    app: backend

spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app: backend

  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: 5000
      protocol: TCP
