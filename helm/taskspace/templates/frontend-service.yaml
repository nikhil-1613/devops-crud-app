apiVersion: v1
kind: Service

metadata:
  name: {{ include "devops-crud-app.fullname" . }}-frontend
  labels:
    {{- include "devops-crud-app.labels" . | nindent 4 }}
    app: frontend

spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app: frontend

  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: 3000
      protocol: TCP
